<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кейс — Прототип</title>
  <meta name="theme-color" content="#151717">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script>document.documentElement.classList.replace('no-js','js')</script>
</head>
<body class="is-case">
  <div class="wipe is-cover" aria-hidden="true"></div>
  <header class="top">
    <a class="logo" href="./" data-wipe>Прототип<sup>студия</sup></a>
    <a class="menu-btn" href="./#raboty" data-wipe><span class="menu-btn__label">Все работы</span></a>
  </header>

  <!-- страница кейса (по brandonyasin.com): крупный заголовок, слева липкая колонка фактов, справа живой сайт -->
  <main class="case">
    <section class="case__head">
      <p class="case__kind"></p>
      <h1 class="case__title"></h1>
      <p class="case__niche"></p>
    </section>
    <div class="case__grid">
      <aside class="case__facts">
        <dl>
          <dt>Ниша</dt><dd data-f="niche"></dd>
          <dt>Тип</dt><dd data-f="kind"></dd>
          <dt>Срок</dt><dd>2–3 дня</dd>
          <dt>Сайт</dt><dd><a data-f="url" target="_blank" rel="noopener">открыть в новой вкладке</a></dd>
        </dl>
      </aside>
      <div class="case__body">
        <h2>Задача</h2><p data-f="task"></p>
        <div class="case__screens">
          <div class="desk"><div class="desk__bar"><i></i><i></i><i></i></div><iframe title="Сайт на компьютере" loading="lazy"></iframe></div>
          <div class="phone phone--case"><div class="phone__screen"><iframe title="Сайт на телефоне" loading="lazy"></iframe></div><span class="phone__island"></span></div>
        </div>
        <h2>Что сделали</h2><ul class="case__did"></ul>
        <h2>Что получает владелец</h2><p data-f="result"></p>
      </div>
    </div>
    <a class="case__next" data-wipe href="#"><span>Следующая работа</span><b></b></a>
  </main>
  <footer class="foot"><span>© 2026 Прототип</span><span>Работы на сайте — демо и концепты</span></footer>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
